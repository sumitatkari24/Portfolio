<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Certifications — Sumit Atkari. Professional certifications and proof of learning." />
  <title>Certifications — Sumit Atkari</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">Sumit Atkari</a>
      <nav class="nav" aria-label="Primary">
        <ul class="nav-list">
          <li><a href="index.html#home" class="nav-link">Home</a></li>
          <li><a href="about.html" class="nav-link">About</a></li>
          <li><a href="skills.html" class="nav-link">Skills</a></li>
          <li><a href="projects.html" class="nav-link">Projects</a></li>
          <li><a href="certifications.html" class="nav-link active">Certifications</a></li>
          <li><a href="experience.html" class="nav-link">Experience</a></li>
          <li><a href="contact.html" class="nav-link">Contact</a></li>
        </ul>
      </nav>
      <button id="navToggle" class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">☰</button>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container">
        <h1 class="hero-title">Certifications</h1>
        <p class="hero-sub muted">Verified certifications and achievements.</p>
      </div>
    </section>

    <section class="section">
        <div class="container">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1rem;flex-wrap:wrap">
            <h2 class="section-title">Your Certificates</h2>
            <div>
              <label class="btn btn-sm btn-outline" for="certUpload">Upload & Preview</label>
              <input id="certUpload" type="file" accept="image/*" multiple style="display:none">
            </div>
          </div>
          <div class="cert-grid"></div>
        </div>
    </section>

    <!-- Certificate modal (lightbox) -->
    <div id="certModal" class="cert-modal" aria-hidden="true">
      <div class="cert-modal-inner">
        <button id="certModalClose" class="btn btn-sm btn-ghost">Close</button>
        <div class="cert-modal-media">
          <img id="certModalImg" src="" alt="Certificate image">
        </div>
        <div id="certModalCaption" class="muted" aria-hidden="true"></div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-left">
        <div class="brand">Sumit Atkari</div>
        <div class="tagline">Digital Media Enthusiast & Developer</div>
      </div>
      <nav class="footer-nav" aria-label="Footer">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="projects.html">Projects</a>
        <a href="contact.html">Contact</a>
      </nav>
      <div class="copyright">© <span id="year"></span> Sumit Atkari. All rights reserved.</div>
    </div>
  </footer>
  <script src="script.js"></script>
</body>
</html>
